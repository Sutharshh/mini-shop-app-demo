
server {
    listen 80;
    server_name _;

    # Serve the HTML, CSS and JavaScript files.
    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to the backend container.
    # Docker Compose resolves "backend" by its service name.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Return the main page for the website.
    location / {
        try_files $uri $uri/ =404;
    }
}
