
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #173b67;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .product, .cart {
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #ddd;
    }

    button {
      background: #176b45;
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #105334;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mini Shop</h1>
    <p>Simple shopping for everyone</p>
  </header>

  <main>
    <h2>Available Products</h2>
    <div id="products">Loading products...</div>

    <section class="cart">
      <h2>Shopping Cart</h2>
      <div id="cart">Your cart is empty.</div>
      <p id="total">Total: ₹0</p>
      <button id="checkout">Place Demo Order</button>
      <p id="message"></p>
    </section>
  </main>

  <script>
    // Store selected products in the browser.
    const cart = {};

    // Fetch products from the backend API.
    async function loadProducts() {
      const response = await fetch("/api/products");

      if (!response.ok) {
        throw new Error("Could not load products.");
      }

      const products = await response.json();
      const container = document.getElementById("products");

      // Build product cards from the API response.
      container.replaceChildren();

      products.forEach(product => {
        const card = document.createElement("article");
        card.className = "product";

        const name = document.createElement("h3");
        name.textContent = product.name;

        const price = document.createElement("p");
        price.textContent = `Price: ₹${product.price}`;

        const button = document.createElement("button");
        button.textContent = "Add to Cart";
        button.addEventListener("click", () => {
          cart[product.id] = (cart[product.id] || 0) + 1;
          renderCart(products);
        });

        card.append(name, price, button);
        container.appendChild(card);
      });
    }

    // Display selected items and calculate the total.
    function renderCart(products) {
      const container = document.getElementById("cart");
      container.replaceChildren();
      let total = 0;
      let hasItems = false;

      products.forEach(product => {
        const quantity = cart[product.id] || 0;

        if (quantity > 0) {
          hasItems = true;
          total += product.price * quantity;

          const line = document.createElement("p");
          line.textContent =
            `${product.name} × ${quantity} = ₹${product.price * quantity}`;
          container.appendChild(line);
        }
      });

      if (!hasItems) {
        container.textContent = "Your cart is empty.";
      }

      document.getElementById("total").textContent =
        `Total: ₹${total}`;
    }

    // Send the cart to the backend for demo checkout.
    async function checkout() {
      const items = Object.entries(cart).map(([id, quantity]) => ({
        id: Number(id),
        quantity
      }));

      const message = document.getElementById("message");

      try {
        const response = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items })
        });

        const result = await response.json();
        message.textContent = result.message;

        if (response.ok) {
          // Empty the cart after a successful demo order.
          Object.keys(cart).forEach(id => delete cart[id]);
          const response = await fetch("/api/products");
          renderCart(await response.json());
        }
      } catch (error) {
        message.textContent = "Checkout failed. Please try again.";
      }
    }

    document.getElementById("checkout")
      .addEventListener("click", checkout);

    loadProducts().catch(() => {
      document.getElementById("products").textContent =
        "Unable to load products. Please try again later.";
    });
  </script>
</body>
</html>
